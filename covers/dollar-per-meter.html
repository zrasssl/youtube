<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
  body{background:#0E1411;font-family:"Inter Display","Inter",sans-serif;color:#fff;position:relative}
  .grid{position:absolute;inset:0;
    background-image:linear-gradient(rgba(212,231,158,.07) 2px,transparent 2px),
                     linear-gradient(90deg,rgba(212,231,158,.07) 2px,transparent 2px);
    background-size:120px 120px;background-position:0 0}
  .glow{position:absolute;left:-200px;top:380px;width:1100px;height:1100px;border-radius:50%;
    background:radial-gradient(circle,rgba(212,231,158,.20),transparent 62%)}
  .sq{position:absolute;left:120px;top:480px;width:480px;height:480px;
    border:6px solid #D4E79E;background:rgba(212,231,158,.08)}
  .dim{position:absolute;font-size:34px;font-weight:600;letter-spacing:.15em;color:#D4E79E}
  .dim.h{left:120px;top:984px;width:480px;text-align:center}
  .dim.v{left:612px;top:480px;height:480px;writing-mode:vertical-rl;text-align:center}
  .tick{position:absolute;background:#D4E79E}
  .price{position:absolute;left:150px;top:520px;font-size:440px;font-weight:900;line-height:1;letter-spacing:-.04em}
  .price span{color:#D4E79E}
  .label{position:absolute;left:120px;top:250px;font-size:34px;font-weight:700;letter-spacing:.22em;color:rgba(255,255,255,.65)}
  .head{position:absolute;left:120px;top:1080px;font-size:132px;font-weight:900;line-height:1.02;letter-spacing:-.02em;text-transform:uppercase}
  .mark{display:inline-block;background:#D4E79E;color:#0E1411;padding:0 22px 6px;margin-top:14px}
  .sub{position:absolute;left:120px;top:1390px;font-size:54px;font-weight:600;color:rgba(255,255,255,.85)}
</style></head><body>
  <div class="grid"></div><div class="glow"></div>
  <div class="label">НЕДВИЖИМОСТЬ · РАЗБОР</div>
  <div class="sq"></div>
  <div class="price"><span>$</span>1</div>
  <div class="dim h">1 М</div>
  <div class="dim v">1 М</div>
  <div class="head">ДОЛЛАР<br><span class="mark">ЗА МЕТР</span></div>
  <div class="sub">Где это правда — и в чём подвох?</div>
</body></html>
