<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#2a1430}
  svg{display:block}
  text{font-family:"DejaVu Sans",sans-serif;font-weight:700}
</style></head><body>
<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1438"/>
      <stop offset=".45" stop-color="#5c2350"/>
      <stop offset=".72" stop-color="#b8475e"/>
      <stop offset=".86" stop-color="#e8846a"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1a33"/><stop offset="1" stop-color="#1f0f1f"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="0" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <g id="man">
      <!-- legs -->
      <path d="M0 0 L-38 120 L-70 170" class="leg"/>
      <path d="M0 0 L30 110 L52 175" class="leg"/>
      <!-- body -->
      <path d="M-34 -190 L34 -190 L28 10 L-28 10 Z" class="body"/>
      <!-- arms -->
      <path d="M-26 -170 L-62 -80 L-40 -20" class="arm"/>
      <path d="M26 -170 L70 -100 L100 -70" class="arm"/>
    </g>
  </defs>
  <style>
    .leg,.arm{fill:none;stroke:#1d0f1c;stroke-width:24;stroke-linecap:round;stroke-linejoin:round;paint-order:stroke}
    .body{fill:#1d0f1c}
    .ol{stroke:#fff3e0;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
  </style>

  <rect width="1080" height="1920" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#fff" opacity=".8" id="stars"></g>

  <!-- sun -->
  <circle cx="540" cy="1250" r="380" fill="url(#sunGlow)"/>
  <circle cx="540" cy="1260" r="190" fill="#ffe3b0"/>

  <!-- city -->
  <g fill="#8a3360" opacity=".75">
    <rect x="0" y="1120" width="120" height="300"/><rect x="110" y="1060" width="90" height="360"/>
    <rect x="200" y="1150" width="140" height="270"/><rect x="330" y="1090" width="80" height="330"/>
    <rect x="700" y="1080" width="110" height="340"/><rect x="800" y="1140" width="140" height="280"/>
    <rect x="930" y="1040" width="80" height="380"/><rect x="1000" y="1130" width="80" height="290"/>
  </g>
  <g fill="#6e2550">
    <rect x="0" y="1220" width="180" height="200"/><rect x="170" y="1180" width="110" height="240"/>
    <rect x="280" y="1250" width="150" height="170"/><rect x="420" y="1290" width="240" height="130"/>
    <rect x="650" y="1230" width="120" height="190"/><rect x="760" y="1190" width="150" height="230"/>
    <rect x="900" y="1240" width="180" height="180"/>
  </g>

  <!-- road -->
  <rect y="1420" width="1080" height="500" fill="url(#road)"/>
  <path d="M440 1420 L640 1420 L900 1920 L180 1920 Z" fill="#4a2238" opacity=".8"/>
  <g stroke="#b48a7a" stroke-width="7" stroke-dasharray="70 70" opacity=".8">
    <line x1="0" y1="1445" x2="1080" y2="1445"/>
  </g>

  <!-- headline -->
  <text x="540" y="440" text-anchor="middle" font-size="300" fill="#ffe6b8" letter-spacing="-6" filter="url(#sh)">$1</text>
  <text x="540" y="560" text-anchor="middle" font-size="74" fill="#ffcf6a" filter="url(#sh)">ЗА КАЖДЫЙ МЕТР</text>

  <!-- sticker -->
  <g transform="translate(540 690) rotate(-3)" filter="url(#sh)">
    <rect x="-420" y="-62" width="840" height="124" rx="16" fill="#fff3dc"/>
    <text x="0" y="26" text-anchor="middle" font-size="64" fill="#e5482f">КТО РАЗБОГАТЕЕТ?</text>
  </g>

  <!-- MAX (sprinting, red cap) -->
  <g transform="translate(330 1250) scale(1.25)">
    <g transform="rotate(8)">
      <use href="#man"/>
      <circle cx="0" cy="-240" r="48" fill="#1d0f1c" stroke="#fff3e0" stroke-width="5"/>
      <path d="M-50 -250 A50 50 0 0 1 50 -250 L66 -246 L-50 -246 Z" fill="#e8533a"/>
    </g>
  </g>
  <g filter="url(#sh)">
    <text x="330" y="880" text-anchor="middle" font-size="72" fill="#ff6a3d" stroke="#2b1438" stroke-width="3">МАКС</text>
  </g>
  <!-- SAM (walking, yellow cap) -->
  <g transform="translate(760 1250) scale(1.25)">
    <use href="#man"/>
    <circle cx="0" cy="-240" r="48" fill="#1d0f1c" stroke="#fff3e0" stroke-width="5"/>
    <path d="M-50 -250 A50 50 0 0 1 50 -250 L66 -246 L-50 -246 Z" fill="#f2c230"/>
  </g>
  <g filter="url(#sh)">
    <text x="760" y="880" text-anchor="middle" font-size="72" fill="#f2c230" stroke="#2b1438" stroke-width="3">САНЯ</text>
  </g>
  <!-- VS -->
  <g transform="translate(545 1040) rotate(-6)" filter="url(#sh)">
    <rect x="-70" y="-50" width="140" height="100" rx="14" fill="#f2c230"/>
    <text x="0" y="24" text-anchor="middle" font-size="64" fill="#2b1438">VS</text>
  </g>
  <!-- shadows on road -->
  <ellipse cx="330" cy="1470" rx="90" ry="14" fill="#000" opacity=".35"/>
  <ellipse cx="760" cy="1470" rx="90" ry="14" fill="#000" opacity=".35"/>
</svg>
<script>
  const g=document.getElementById('stars');let s=7;const r=()=>(s=(s*9301+49297)%233280)/233280;
  for(let i=0;i<140;i++){const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',r()*1080);c.setAttribute('cy',r()*1000);c.setAttribute('r',1+r()*2.5);c.setAttribute('opacity',.3+r()*.7);g.appendChild(c);}
</script>
</body></html>
